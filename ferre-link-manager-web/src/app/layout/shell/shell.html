<a class="skip-link" href="/" (click)="skipToContent($event)">İçeriğe geç</a>

<mat-toolbar class="shell-toolbar">
  <a class="shell-brand" routerLink="/">
    <span class="auth-logo">F</span>
    <span class="shell-brand-name">Ferre Link Manager</span>
  </a>

  <nav class="shell-nav" aria-label="Ana menü">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Linklerim
    </a>
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Yönetim</a>
    }
  </nav>

  <span class="shell-spacer"></span>

  @if (auth.user(); as user) {
    <button mat-button class="shell-user" [matMenuTriggerFor]="userMenu" aria-label="Hesap menüsü">
      <span class="shell-avatar">{{ initial() }}</span>
      <span class="shell-email">{{ user.email }}</span>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="shell-menu-info">
        <div>{{ user.email }}</div>
        <div>Rol: {{ user.roles.join(', ') }}</div>
      </div>
      <button mat-menu-item (click)="logout()">Çıkış yap</button>
    </mat-menu>
  }
</mat-toolbar>

<main id="main-content" class="shell-content" tabindex="-1">
  <router-outlet />
</main>
